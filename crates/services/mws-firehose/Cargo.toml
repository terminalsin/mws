[package]
name = "mws-firehose"
description = "Amazon Data Firehose for MWS: delivery streams that buffer records (direct put or from Kinesis data streams), transform them (Lambda, decompression, dynamic partitioning) and deliver them to S3, HTTP endpoints, Splunk and OpenSearch, with IAM enforced."
