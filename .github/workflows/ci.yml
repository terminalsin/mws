name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  # Each end-to-end test binary links several AWS SDKs; full debug info
  # makes the link step exhaust the runner's disk.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      # Free disk for target/ (the runner starts with ~20 GB). Deleting takes
      # ~50s, so run it in the background while the job carries on.
      - run: nohup sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL > /dev/null 2>&1 &
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Lambda functions in the end-to-end tests run on this Python (with
      # boto3, as Lambda's Python runtimes have it), so set it up first.
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
      - run: pip install -r tests/e2e-python/requirements.txt
      # --all-targets skips doctests: the workspace has none, and rustdoc
      # still spends ~20s per run compiling an empty harness for every crate.
      - run: cargo test --workspace --all-targets
        env:
          MWS_LAMBDA_PYTHON: ${{ steps.python.outputs.python-path }}
      # `cargo test` built target/debug/mws for crates/mws/tests/binary.rs;
      # a separate `cargo build` would recompile the service crates.
      - run: pytest -q tests/e2e-python
        env:
          MWS_LAMBDA_PYTHON: ${{ steps.python.outputs.python-path }}

  # Example applications written against the AWS SDK for JavaScript v3
  # (tests/e2e-ts), run against the MWS binary.
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: mws-binary
      - run: cargo build -p mws
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/e2e-ts/package-lock.json
      - run: npm ci
        working-directory: tests/e2e-ts
      - run: npm run typecheck
        working-directory: tests/e2e-ts
      # Lambda functions in the examples run on this job's `node`.
      - run: |
          RUST_LOG=warn MWS_LISTEN=127.0.0.1:4566 nohup target/debug/mws > mws.log 2>&1 &
          for _ in $(seq 100); do curl -sf http://127.0.0.1:4566/_mws/health > /dev/null && exit 0; sleep 0.1; done
          cat mws.log; exit 1
      - run: npm test
        working-directory: tests/e2e-ts
      - if: failure()
        run: cat mws.log
