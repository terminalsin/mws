name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  # Each end-to-end test binary links several AWS SDKs; full debug info
  # makes the link step exhaust the runner's disk.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      # The workspace's test binaries outgrow the runner's free disk; drop
      # preinstalled toolchains this job never uses.
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Lambda functions in the end-to-end tests run on this Python (with
      # boto3, as Lambda's Python runtimes have it), so set it up first.
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
      - run: pip install -r tests/e2e-python/requirements.txt
      - run: cargo test --workspace
        env:
          MWS_LAMBDA_PYTHON: ${{ steps.python.outputs.python-path }}
      # The test binaries are no longer needed; make room for the binary.
      - run: find target/debug/deps -maxdepth 1 -type f -executable ! -name '*.so' -delete && df -h /
      - run: cargo build -p mws
      - run: pytest -q tests/e2e-python
        env:
          MWS_LAMBDA_PYTHON: ${{ steps.python.outputs.python-path }}
