[workspace]
resolver = "2"
members = [
    "crates/mws-core",
    "crates/mws-sigv4",
    "crates/mws-smithy",
    "crates/mws-codegen",
    "crates/mws-proto-query",
    "crates/mws-proto-restxml",
    "crates/mws-proto-json",
    "crates/mws-xml",
    "crates/mws-server",
    "crates/mws-store",
    "crates/mws",
    "crates/services/mws-iam",
    "crates/services/mws-iam-policy",
    "crates/services/mws-sts",
    "crates/services/mws-route53",
    "crates/services/mws-acmpca",
    "tests/e2e-rust",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
# internal
mws-core = { path = "crates/mws-core" }
mws-sigv4 = { path = "crates/mws-sigv4" }
mws-smithy = { path = "crates/mws-smithy" }
mws-codegen = { path = "crates/mws-codegen" }
mws-proto-query = { path = "crates/mws-proto-query" }
mws-proto-restxml = { path = "crates/mws-proto-restxml" }
mws-proto-json = { path = "crates/mws-proto-json" }
mws-xml = { path = "crates/mws-xml" }
mws-server = { path = "crates/mws-server" }
mws-store = { path = "crates/mws-store" }
mws = { path = "crates/mws" }
mws-iam = { path = "crates/services/mws-iam" }
mws-iam-policy = { path = "crates/services/mws-iam-policy" }
mws-sts = { path = "crates/services/mws-sts" }
mws-route53 = { path = "crates/services/mws-route53" }
mws-acmpca = { path = "crates/services/mws-acmpca" }

# external
async-trait = "0.1"
aws-lc-rs = "1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
form_urlencoded = "1"
hex = "0.4"
hmac = "0.12"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio"] }
percent-encoding = "2"
rand = "0.8"
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
regex = "1"
rustls-pki-types = "1"
roxmltree = "0.20"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
subtle = "2"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
x509-parser = { version = "0.16", features = ["verify"] }
