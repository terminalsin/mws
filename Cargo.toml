[workspace]
resolver = "2"
members = [
    "crates/mws-core",
    "crates/mws-sigv4",
    "crates/mws-smithy",
    "crates/mws-codegen",
    "crates/mws-proto-query",
    "crates/mws-proto-restxml",
    "crates/mws-proto-json",
    "crates/mws-proto-restjson",
    "crates/mws-proto-cbor",
    "crates/mws-proto-ec2",
    "crates/mws-xml",
    "crates/mws-server",
    "crates/mws-store",
    "crates/mws-event-pattern",
    "crates/mws-schedule",
    "crates/mws",
    "crates/services/mws-iam",
    "crates/services/mws-iam-policy",
    "crates/services/mws-sts",
    "crates/services/mws-route53",
    "crates/services/mws-acmpca",
    "crates/services/mws-kms",
    "crates/services/mws-organizations",
    "crates/services/mws-s3",
    "crates/services/mws-lambda",
    "crates/services/mws-s3control",
    "crates/services/mws-logs",
    "crates/services/mws-sqs",
    "crates/services/mws-ssm",
    "crates/services/mws-events",
    "crates/services/mws-secretsmanager",
    "crates/services/mws-sns",
    "crates/services/mws-acm",
    "crates/services/mws-marketplace-entitlement",
    "crates/services/mws-marketplace-metering",
    "crates/services/mws-kinesis",
    "crates/services/mws-firehose",
    "crates/services/mws-cloudwatch",
    "crates/services/mws-ec2",
    "crates/services/mws-amplify",
    "crates/services/mws-globalaccelerator",
    "crates/services/mws-ram",
    "crates/services/mws-pca-connector-scep",
    "crates/services/mws-securityhub",
    "crates/services/mws-imagebuilder",
    "crates/services/mws-elb",
    "crates/services/mws-ses",
    "crates/services/mws-rds",
    "tests/e2e-rust",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
# internal
mws-core = { path = "crates/mws-core" }
mws-event-pattern = { path = "crates/mws-event-pattern" }
mws-schedule = { path = "crates/mws-schedule" }
mws-sigv4 = { path = "crates/mws-sigv4" }
mws-smithy = { path = "crates/mws-smithy" }
mws-codegen = { path = "crates/mws-codegen" }
mws-proto-query = { path = "crates/mws-proto-query" }
mws-proto-restxml = { path = "crates/mws-proto-restxml" }
mws-proto-json = { path = "crates/mws-proto-json" }
mws-proto-restjson = { path = "crates/mws-proto-restjson" }
mws-proto-cbor = { path = "crates/mws-proto-cbor" }
mws-proto-ec2 = { path = "crates/mws-proto-ec2" }
mws-xml = { path = "crates/mws-xml" }
mws-server = { path = "crates/mws-server" }
mws-store = { path = "crates/mws-store" }
mws = { path = "crates/mws" }
mws-iam = { path = "crates/services/mws-iam" }
mws-iam-policy = { path = "crates/services/mws-iam-policy" }
mws-sts = { path = "crates/services/mws-sts" }
mws-route53 = { path = "crates/services/mws-route53" }
mws-acmpca = { path = "crates/services/mws-acmpca" }
mws-kms = { path = "crates/services/mws-kms" }
mws-organizations = { path = "crates/services/mws-organizations" }
mws-s3 = { path = "crates/services/mws-s3" }
mws-lambda = { path = "crates/services/mws-lambda" }
mws-s3control = { path = "crates/services/mws-s3control" }
mws-logs = { path = "crates/services/mws-logs" }
mws-sqs = { path = "crates/services/mws-sqs" }
mws-ssm = { path = "crates/services/mws-ssm" }
mws-events = { path = "crates/services/mws-events" }
mws-secretsmanager = { path = "crates/services/mws-secretsmanager" }
mws-sns = { path = "crates/services/mws-sns" }
mws-acm = { path = "crates/services/mws-acm" }
mws-marketplace-entitlement = { path = "crates/services/mws-marketplace-entitlement" }
mws-marketplace-metering = { path = "crates/services/mws-marketplace-metering" }
mws-kinesis = { path = "crates/services/mws-kinesis" }
mws-firehose = { path = "crates/services/mws-firehose" }
mws-cloudwatch = { path = "crates/services/mws-cloudwatch" }
mws-ec2 = { path = "crates/services/mws-ec2" }
mws-amplify = { path = "crates/services/mws-amplify" }
mws-globalaccelerator = { path = "crates/services/mws-globalaccelerator" }
mws-ram = { path = "crates/services/mws-ram" }
mws-pca-connector-scep = { path = "crates/services/mws-pca-connector-scep" }
mws-securityhub = { path = "crates/services/mws-securityhub" }
mws-imagebuilder = { path = "crates/services/mws-imagebuilder" }
mws-elb = { path = "crates/services/mws-elb" }
mws-ses = { path = "crates/services/mws-ses" }
mws-rds = { path = "crates/services/mws-rds" }

# external
async-trait = "0.1"
aws-lc-rs = "1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
form_urlencoded = "1"
hex = "0.4"
hmac = "0.12"
http = "1"
http-body-util = "0.1"
md-5 = "0.10"
num-bigint = "0.4"
qrcode = { version = "0.14", default-features = false }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio"] }
percent-encoding = "2"
rand = "0.8"
rcgen = { version = "0.13", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
regex = "1"
fancy-regex = "0.14"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
rustls-native-certs = "0.8"
rustls-pki-types = "1"
tokio-rustls = { version = "0.26", default-features = false }
roxmltree = "0.20"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
sha1 = "0.10"
sha2 = "0.10"
flate2 = "1"
snap = "1"
bzip2 = "0.6"
subtle = "2"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
x509-parser = { version = "0.16", features = ["verify"] }
yaml-rust2 = "0.10"
