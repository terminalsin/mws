[package]
name = "mws-e2e"
description = "End-to-end tests: real AWS SDK clients against a running MWS."
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = { version = "1", features = ["hardcoded-credentials"] }
aws-sdk-iam = "1"
aws-sdk-sts = "1"
aws-sdk-route53 = "1"
aws-sdk-acmpca = "1"
aws-sdk-kms = "1"
aws-sdk-organizations = "1"
aws-sdk-s3 = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3control = "1"
aws-sdk-lambda = "1"
aws-sdk-cloudwatchlogs = "1"
aws-sdk-sqs = "1"
aws-sdk-ssm = "1"
aws-sdk-eventbridge = "1"
aws-sdk-secretsmanager = "1"
aws-sdk-sns = "1"
aws-sdk-acm = "1"
aws-sdk-kinesis = "1"
aws-sdk-firehose = "1"
aws-sdk-cloudwatch = "1"
aws-sdk-ec2 = "1"
aws-sdk-amplify = "1"
aws-smithy-http-client = { version = "1", features = ["rustls-aws-lc"] }
aws-smithy-runtime-api = { version = "1", features = ["client"] }
zip.workspace = true
mws-s3.workspace = true
rcgen.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
tokio-rustls.workspace = true
x509-parser.workspace = true
urlencoding = "2"
time.workspace = true
aws-lc-rs.workspace = true
base64.workspace = true
chrono.workspace = true
flate2.workspace = true
md-5.workspace = true
serde_json.workspace = true
mws.workspace = true
mws-ec2.workspace = true
mws-route53.workspace = true
mws-server.workspace = true
mws-sigv4.workspace = true
tokio = { workspace = true, features = ["io-util"] }

