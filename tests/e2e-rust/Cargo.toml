[package]
name = "mws-e2e"
description = "End-to-end tests: real AWS SDK clients against a running MWS."
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = { version = "1", features = ["hardcoded-credentials"] }
aws-sdk-iam = "1"
aws-sdk-sts = "1"
aws-sdk-route53 = "1"
aws-sdk-acmpca = "1"
aws-sdk-kms = "1"
aws-sdk-organizations = "1"
aws-sdk-s3 = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3control = "1"
aws-sdk-lambda = "1"
aws-sdk-cloudtrail = "1"
aws-sdk-cloudtraildata = "1"
aws-sdk-cloudwatchlogs = "1"
aws-sdk-sqs = "1"
aws-sdk-ssm = "1"
aws-sdk-eventbridge = "1"
aws-sdk-secretsmanager = "1"
aws-sdk-sns = "1"
aws-sdk-acm = "1"
aws-sdk-kinesis = "1"
aws-sdk-firehose = "1"
aws-sdk-cloudwatch = "1"
aws-sdk-ec2 = "1"
aws-sdk-amplify = "1"
aws-sdk-globalaccelerator = "1"
aws-sdk-marketplaceentitlement = "1"
aws-sdk-marketplacemetering = "1"
aws-sdk-ram = "1"
aws-sdk-pcaconnectorscep = "1"
aws-sdk-securityhub = "1"
aws-smithy-types = "1"
aws-sigv4 = "1"
aws-sdk-imagebuilder = "1"
aws-sdk-elasticloadbalancingv2 = "1"
aws-sdk-elasticloadbalancing = "1"
aws-sdk-autoscaling = "1"
aws-sdk-ses = "1"
aws-sdk-sesv2 = "1"
aws-sdk-rds = "1"
aws-sdk-eks = "1"
aws-sdk-efs = "1"
aws-sdk-codeartifact = "1"
aws-smithy-http-client = { version = "1", features = ["rustls-aws-lc"] }
aws-smithy-runtime-api = { version = "1", features = ["client"] }
zip.workspace = true
mws-s3.workspace = true
rcgen.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
tokio-rustls.workspace = true
x509-parser.workspace = true
urlencoding = "2"
# An independent SCEP client (RustCrypto CMS), to check the connector's
# endpoint against a CMS implementation that is not MWS's own.
cms = { version = "0.2", features = ["builder"] }
rsa = { version = "0.9", features = ["sha2"] }
x509-cert = { version = "0.2", features = ["builder"] }
sha2-010 = { package = "sha2", version = "0.10", features = ["oid"] }
aes = "0.8"
cbc = "0.1"
rand_core-06 = { package = "rand_core", version = "0.6", features = ["getrandom"] }
time.workspace = true
aws-lc-rs.workspace = true
base64.workspace = true
form_urlencoded.workspace = true
chrono.workspace = true
flate2.workspace = true
regex.workspace = true
md-5.workspace = true
hex.workspace = true
sha1.workspace = true
serde_json.workspace = true
mws.workspace = true
mws-ec2.workspace = true
mws-rds.workspace = true
mws-eks.workspace = true
mws-codeartifact.workspace = true
mws-route53.workspace = true
mws-server.workspace = true
mws-ses.workspace = true
mws-sigv4.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tokio-postgres = "0.7"

